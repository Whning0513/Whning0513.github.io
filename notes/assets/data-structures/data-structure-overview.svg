<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">数据结构的三种组织方式</title>
  <desc id="desc">线性结构、树和图分别用顺序或链接关系组织数据。</desc>
  <style>
    .bg { fill: #fbfaf7; }
    .ink { fill: #242522; font: 600 18px "Segoe UI", "Microsoft YaHei", sans-serif; }
    .muted { fill: #6f7069; font: 15px "Segoe UI", "Microsoft YaHei", sans-serif; }
    .label { fill: #b34b32; font: 600 14px "Segoe UI", "Microsoft YaHei", sans-serif; }
    .box { fill: #f4f3ef; stroke: #d7d5cf; stroke-width: 1.5; }
    .node { fill: #fff; stroke: #b34b32; stroke-width: 2; }
    .line { fill: none; stroke: #6f7069; stroke-width: 2; }
    .accent-line { fill: none; stroke: #b34b32; stroke-width: 2; }
  </style>
  <rect class="bg" width="760" height="300"/>
  <text class="label" x="32" y="34">同一份数据，换一种组织方式，操作代价就会变</text>
  <line class="line" x1="32" y1="52" x2="728" y2="52"/>

  <rect class="box" x="24" y="78" width="224" height="166" rx="5"/>
  <text class="ink" x="42" y="108">线性结构</text>
  <text class="muted" x="42" y="132">顺序表 / 链表 / 栈 / 队列</text>
  <rect class="node" x="44" y="164" width="42" height="32" rx="3"/>
  <rect class="node" x="94" y="164" width="42" height="32" rx="3"/>
  <rect class="node" x="144" y="164" width="42" height="32" rx="3"/>
  <rect class="node" x="194" y="164" width="32" height="32" rx="3"/>
  <line class="accent-line" x1="86" y1="180" x2="94" y2="180"/>
  <line class="accent-line" x1="136" y1="180" x2="144" y2="180"/>
  <line class="accent-line" x1="186" y1="180" x2="194" y2="180"/>
  <text class="muted" x="42" y="220">重点：访问、插入、删除</text>

  <rect class="box" x="268" y="78" width="224" height="166" rx="5"/>
  <text class="ink" x="286" y="108">树</text>
  <text class="muted" x="286" y="132">层次关系，根到叶</text>
  <line class="line" x1="380" y1="158" x2="340" y2="193"/>
  <line class="line" x1="380" y1="158" x2="420" y2="193"/>
  <line class="line" x1="340" y1="193" x2="316" y2="222"/>
  <line class="line" x1="340" y1="193" x2="364" y2="222"/>
  <circle class="node" cx="380" cy="153" r="13"/>
  <circle class="node" cx="340" cy="193" r="13"/>
  <circle class="node" cx="420" cy="193" r="13"/>
  <circle class="node" cx="316" cy="222" r="11"/>
  <circle class="node" cx="364" cy="222" r="11"/>
  <text class="muted" x="286" y="238">重点：遍历、顺序与高度</text>

  <rect class="box" x="512" y="78" width="224" height="166" rx="5"/>
  <text class="ink" x="530" y="108">图</text>
  <text class="muted" x="530" y="132">任意顶点之间的关系</text>
  <line class="line" x1="570" y1="174" x2="632" y2="157"/>
  <line class="line" x1="632" y1="157" x2="690" y2="187"/>
  <line class="line" x1="690" y1="187" x2="650" y2="222"/>
  <line class="line" x1="650" y1="222" x2="570" y2="218"/>
  <line class="line" x1="570" y1="218" x2="570" y2="174"/>
  <line class="line" x1="570" y1="174" x2="690" y2="187"/>
  <circle class="node" cx="570" cy="174" r="13"/>
  <circle class="node" cx="632" cy="157" r="13"/>
  <circle class="node" cx="690" cy="187" r="13"/>
  <circle class="node" cx="650" cy="222" r="13"/>
  <circle class="node" cx="570" cy="218" r="13"/>
  <text class="muted" x="530" y="238">重点：连通、路径、权重</text>

  <text class="muted" x="32" y="278">复习时每一节都问三件事：怎么表示？基本操作多快？哪些条件不能少？</text>
</svg>
