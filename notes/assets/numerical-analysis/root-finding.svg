<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">求根方法示意图</title>
  <desc id="desc">曲线与横轴相交，下面画出二分法的区间和 Newton 迭代的切线。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#77736b" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fbfaf7"/>
  <g fill="none" stroke="#77736b" stroke-width="1.4">
    <path d="M58 218 H712" marker-end="url(#arrow)"/>
    <path d="M82 270 V42" marker-end="url(#arrow)"/>
  </g>
  <g fill="#77736b" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15">
    <text x="716" y="223">x</text>
    <text x="70" y="38">f(x)</text>
  </g>
  <path d="M92 188 C156 177 188 148 238 166 C284 183 292 224 344 224 C409 224 413 86 493 83 C567 80 560 224 693 224"
        fill="none" stroke="#a44b35" stroke-width="3"/>
  <g stroke="#b9b4aa" stroke-width="1.2" stroke-dasharray="5 5">
    <path d="M238 166 V274"/>
    <path d="M344 224 V274"/>
    <path d="M493 83 V274"/>
    <path d="M560 224 V274"/>
  </g>
  <g fill="#a44b35">
    <circle cx="238" cy="166" r="4"/>
    <circle cx="344" cy="224" r="4"/>
    <circle cx="560" cy="224" r="4"/>
  </g>
  <g fill="#292825" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16">
    <text x="225" y="150">x*</text>
    <text x="480" y="70">x₀</text>
    <text x="566" y="244">x₁</text>
  </g>
  <path d="M470 120 L560 224" fill="none" stroke="#77736b" stroke-width="1.8"/>
  <path d="M493 274 H560" fill="none" stroke="#a44b35" stroke-width="3"/>
  <path d="M493 274 V264 M560 274 V264" fill="none" stroke="#a44b35" stroke-width="2"/>
  <g fill="#a44b35" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16">
    <text x="501" y="300">二分：区间不断减半</text>
  </g>
  <g fill="#77736b" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16">
    <text x="430" y="112">Newton：切线落到横轴</text>
  </g>
</svg>
