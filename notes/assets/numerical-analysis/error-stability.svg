<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">条件数与稳定性示意图</title>
  <desc id="desc">输入先发生扰动，再经过问题和算法，分别表示问题条件与算法稳定性。</desc>
  <rect width="760" height="300" fill="#fbfaf7"/>
  <g fill="none" stroke="#77736b" stroke-width="1.5">
    <path d="M58 150 H160" />
    <path d="M258 150 H358" />
    <path d="M458 150 H560" />
    <path d="M151 143 L160 150 L151 157" />
    <path d="M349 143 L358 150 L349 157" />
    <path d="M551 143 L560 150 L551 157" />
  </g>
  <g fill="#fbfaf7" stroke="#a44b35" stroke-width="2">
    <rect x="18" y="108" width="140" height="84" rx="2"/>
    <rect x="158" y="108" width="100" height="84" rx="2"/>
    <rect x="358" y="108" width="100" height="84" rx="2"/>
    <rect x="558" y="108" width="184" height="84" rx="2"/>
  </g>
  <g fill="#292825" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" text-anchor="middle">
    <text x="88" y="137">原输入 x</text>
    <text x="88" y="166">问题数据</text>
    <text x="208" y="137">扰动 x*</text>
    <text x="208" y="166">输入误差</text>
    <text x="408" y="137">f(x*)</text>
    <text x="408" y="166">条件数放大</text>
    <text x="650" y="137">算法输出</text>
    <text x="650" y="166">舍入与稳定性</text>
  </g>
  <g fill="#77736b" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle">
    <text x="208" y="226">forward / backward</text>
    <text x="408" y="226">problem conditioning</text>
    <text x="650" y="226">algorithm stability</text>
  </g>
</svg>
